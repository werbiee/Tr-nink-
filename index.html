<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Můj Trénink 7 dní</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --success-color: #22c55e;
      --rest-color: #f59e0b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      padding-bottom: 140px;
    }
    h1 { text-align: center; color: var(--accent-color); font-size: 20px; margin-bottom: 4px; }
    .subtitle { text-align: center; color: var(--text-muted); font-size: 12px; margin-bottom: 15px; }
    
    /* Week Selector */
    .week-selector {
      display: flex;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .week-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 4px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
    .week-btn.active {
      background: var(--accent-color);
      color: #000;
    }

    /* Day Card */
    .day-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 15px;
      margin-bottom: 15px;
      border-left: 4px solid var(--accent-color);
    }
    .day-card.rest-day {
      border-left-color: var(--rest-color);
      opacity: 0.9;
    }
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .day-title { font-size: 15px; font-weight: bold; color: var(--accent-color); }
    .day-card.rest-day .day-title { color: var(--rest-color); }
    .clear-btn {
      background: transparent;
      border: 1px solid #475569;
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
    }

    /* Exercise Item with Larger Embedded Image */
    .exercise-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #334155;
      gap: 12px;
    }
    .exercise-item:last-child { border-bottom: none; }
    
    .exercise-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    
    .exercise-img {
      width: 75px;
      height: 75px;
      border-radius: 10px;
      object-fit: contain;
      background-color: #0f172a;
      padding: 6px;
      border: 1px solid var(--accent-color);
      flex-shrink: 0;
    }

    .exercise-info { display: flex; flex-direction: column; }
    .exercise-name { font-weight: 600; font-size: 15px; }
    .exercise-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    
    input[type="checkbox"] {
      width: 24px;
      height: 24px;
      accent-color: var(--success-color);
      cursor: pointer;
      flex-shrink: 0;
    }
    .completed { text-decoration: line-through; opacity: 0.4; }

    /* Sticky Timer */
    .timer-container {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: var(--card-bg);
      border: 2px solid var(--accent-color);
      border-radius: 14px;
      padding: 10px 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
    }
    .timer-display { font-size: 24px; font-weight: bold; font-family: monospace; }
    .timer-controls { display: flex; gap: 6px; }
    .timer-btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }
    .timer-btn.reset { background: #ef4444; color: white; }
    .preset-btn {
      background: #334155;
      color: var(--text-color);
      border: 1px solid #475569;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🏋️ Trénink 7 Dní</h1>
  <div class="subtitle">78 kg / 186 cm – Zpevnění & Náběr</div>

  <div class="week-selector">
    <button class="week-btn active" id="w1" onclick="selectWeek(1)">Týden 1</button>
    <button class="week-btn" id="w2" onclick="selectWeek(2)">Týden 2 (+2 op.)</button>
    <button class="week-btn" id="w3" onclick="selectWeek(3)">Týden 3 (+1 séria)</button>
    <button class="week-btn" id="w4" onclick="selectWeek(4)">Týden 4 (Deload)</button>
  </div>

  <div id="app"></div>

  <div class="timer-container">
    <div>
      <div style="font-size: 9px; color: var(--text-muted);">ODPOČÍNEK</div>
      <div class="timer-display" id="time">01:30</div>
      <div style="margin-top: 3px; display: flex; gap: 4px;">
        <button class="preset-btn" onclick="setPreset(60)">60s</button>
        <button class="preset-btn" onclick="setPreset(90)">90s</button>
      </div>
    </div>
    <div class="timer-controls">
      <button class="timer-btn" onclick="toggleTimer()" id="startBtn">Start</button>
      <button class="timer-btn reset" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <script>
    let currentWeek = 1;

    // Přímé vestavěné SVG vektory znázorňující pohyb (start-cíl) bez nutnosti cizího serveru
    const imgs = {
      pushup: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%2338bdf8' stroke-width='4' stroke-linecap='round'><path d='M20 40 L50 40 L70 50'/><circle cx='15' cy='35' r='5'/><path d='M20 75 L50 75 L80 65' stroke='%2322c55e'/><circle cx='15' cy='70' r='5' fill='%2322c55e'/><path d='M50 45 L50 65' stroke='%2394a3b8' stroke-width='2' stroke-dasharray='4'/></svg>",
      pike: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%2338bdf8' stroke-width='4' stroke-linecap='round'><path d='M25 75 L50 30 L75 75'/><circle cx='50' cy='22' r='5'/><path d='M50 35 L50 55' stroke='%2394a3b8' stroke-width='2' stroke-dasharray='4'/></svg>",
      squat: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%2338bdf8' stroke-width='4' stroke-linecap='round'><circle cx='50' cy='20' r='5'/><path d='M50 25 L50 55 L35 85 M50 55 L65 85'/><path d='M50 35 L50 65' stroke='%2394a3b8' stroke-width='2' stroke-dasharray='4'/></svg>",
      lunge: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%2338bdf8' stroke-width='4' stroke-linecap='round'><circle cx='40' cy='20' r='5'/><path d='M40 25 L40 50 L65 50 L65 80 M40 50 L20 80'/></svg>",
      plank: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%2338bdf8' stroke-width='4' stroke-linecap='round'><circle cx='20' cy='45' r='5'/><path d='M25 50 L85 50 M30 50 L30 70 M75 50 L75 70'/></svg>",
      walk: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%23f59e0b' stroke-width='4' stroke-linecap='round'><circle cx='50' cy='20' r='5'/><path d='M50 25 L50 55 L35 85 M50 55 L70 80 M50 35 L30 50 M50 35 L65 45'/></svg>",
      pull: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%2338bdf8' stroke-width='4' stroke-linecap='round'><path d='M20 30 L80 30' stroke='%2394a3b8'/><path d='M30 65 L70 35'/><circle cx='25' cy='70' r='5'/></svg>",
      dips: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%2338bdf8' stroke-width='4' stroke-linecap='round'><path d='M30 40 L30 85 M70 40 L70 85' stroke='%2394a3b8'/><circle cx='50' cy='25' r='5'/><path d='M50 30 L50 60 L30 45 M50 60 L70 45'/></svg>",
      burpee: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%2338bdf8' stroke-width='4' stroke-linecap='round'><circle cx='50' cy='15' r='5'/><path d='M50 20 L50 50 M30 30 L70 30 M20 80 L50 50 L80 80'/></svg>",
      abs: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%2338bdf8' stroke-width='4' stroke-linecap='round'><circle cx='25' cy='65' r='5'/><path d='M30 70 L60 70 L80 50'/></svg>",
      rest: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%23f59e0b' stroke-width='4' stroke-linecap='round'><circle cx='50' cy='30' r='10'/><path d='M30 70 Q 50 50 70 70'/></svg>"
    };

    const baseSchedule = [
      {
        id: "day1",
        day: "Pondělí: Vršek (Hrudník + Ramena)",
        isRest: false,
        exercises: [
          { id: "d1_e1", name: "Kliky (střední šířka)", base: "3 série × 10 opakování", img: imgs.pushup },
          { id: "d1_e2", name: "Pike Push-ups (na ramena)", base: "3 série × 8 opakování", img: imgs.pike },
          { id: "d1_e3", name: "Široké kliky", base: "3 série × 10 opakování", img: imgs.pushup },
          { id: "d1_e4", name: "Plank (Prkno)", base: "3 série × 45 sekund", img: imgs.plank }
        ]
      },
      {
        id: "day2",
        day: "Úterý: Spodek (Nohy + Střed těla)",
        isRest: false,
        exercises: [
          { id: "d2_e1", name: "Hluboké dřepy", base: "3 série × 15 opakování", img: imgs.squat },
          { id: "d2_e2", name: "Výpady vzad", base: "3 série × 10 / noha", img: imgs.lunge },
          { id: "d2_e3", name: "Glute Bridge (Pánev)", base: "3 série × 15 opakování", img: imgs.plank },
          { id: "d2_e4", name: "Zvedání nohou v leže", base: "3 série × 12 opakování", img: imgs.abs }
        ]
      },
      {
        id: "day3",
        day: "Středa: Aktivní Odpočinek 🧘‍♂️",
        isRest: true,
        exercises: [
          { id: "d3_e1", name: "Procházka na čerstvém vzduchu", base: "30–45 minut", img: imgs.walk },
          { id: "d3_e2", name: "Lehký strečink celého těla", base: "10–15 minut", img: imgs.walk }
        ]
      },
      {
        id: "day4",
        day: "Čtvrtek: Vršek (Záda + Biceps + Triceps)",
        isRest: false,
        exercises: [
          { id: "d4_e1", name: "Inverted Rows (Přítahy ručník/stůl)", base: "3 série × 10 opakování", img: imgs.pull },
          { id: "d4_e2", name: "Tricepsové kliky o židli (Dips)", base: "3 série × 12 opakování", img: imgs.dips },
          { id: "d4_e3", name: "Izometrický přítah v předklonu", base: "3 série × 30 sekund stisk", img: imgs.pull },
          { id: "d4_e4", name: "Boční plank", base: "3 série × 30s / strana", img: imgs.plank }
        ]
      },
      {
        id: "day5",
        day: "Pátek: Celé tělo + Kondice",
        isRest: false,
        exercises: [
          { id: "d5_e1", name: "Angličáky (Burpees)", base: "3 série × 8 opakování", img: imgs.burpee },
          { id: "d5_e2", name: "Bulharské dřepy (noha vzadu)", base: "3 série × 8 / noha", img: imgs.lunge },
          { id: "d5_e3", name: "Horolezec (Mountain Climbers)", base: "3 série × 30 sekund", img: imgs.plank },
          { id: "d5_e4", name: "Zkracovačky na břicho", base: "3 série × 15 opakování", img: imgs.abs }
        ]
      },
      {
        id: "day6",
        day: "Sobota: Lehké Kardio / Pohyb 🚶‍♂️",
        isRest: true,
        exercises: [
          { id: "d6_e1", name: "Svižná procházka nebo kolo", base: "45–60 minut", img: imgs.walk },
          { id: "d6_e2", name: "Mobilita kyčlí a ramen", base: "10 minut", img: imgs.walk }
        ]
      },
      {
        id: "day7",
        day: "Neděle: Plný Odpočinek & Regenerace 💤",
        isRest: true,
        exercises: [
          { id: "d7_e1", name: "Kvalitní spánek & Dobré jídlo", base: "Náběr sil do nového týdne", img: imgs.rest }
        ]
      }
    ];

    function selectWeek(weekNum) {
      currentWeek = weekNum;
      for (let i = 1; i <= 4; i++) {
        document.getElementById(`w${i}`).classList.remove('active');
      }
      document.getElementById(`w${weekNum}`).classList.add('active');
      renderApp();
    }

    function formatMeta(baseText, week) {
      if (week === 2) return baseText + " -> (+2 op. navíc)";
      if (week === 3) return baseText.replace("3 série", "4 série") + " -> (MAX zátěž!)";
      if (week === 4) return baseText.replace("3 série", "2 série") + " -> (Deload / Regenerace)";
      return baseText;
    }

    function renderApp() {
      const app = document.getElementById('app');
      const savedState = JSON.parse(localStorage.getItem('workoutState_v2') || '{}');
      
      app.innerHTML = baseSchedule.map(group => `
        <div class="day-card ${group.isRest ? 'rest-day' : ''}">
          <div class="day-header">
            <span class="day-title">${group.day}</span>
            <button class="clear-btn" onclick="clearDay('${group.id}')">Reset dne</button>
          </div>
          ${group.exercises.map(ex => {
            const key = `${ex.id}_w${currentWeek}`;
            const checked = savedState[key] ? 'checked' : '';
            const completedClass = savedState[key] ? 'completed' : '';
            const metaText = formatMeta(ex.base, currentWeek);
            return `
              <div class="exercise-item">
                <div class="exercise-left">
                  <img class="exercise-img" src="${ex.img}" alt="${ex.name}" />
                  <div class="exercise-info ${completedClass}">
                    <span class="exercise-name">${ex.name}</span>
                    <span class="exercise-meta">${metaText}</span>
                  </div>
                </div>
                <input type="checkbox" ${checked} onchange="toggleExercise('${key}')">
              </div>
            `;
          }).join('')}
        </div>
      `).join('');
    }

    function toggleExercise(key) {
      const savedState = JSON.parse(localStorage.getItem('workoutState_v2') || '{}');
      savedState[key] = !savedState[key];
      localStorage.setItem('workoutState_v2', JSON.stringify(savedState));
      renderApp();
    }

    function clearDay(dayId) {
      const day = baseSchedule.find(d => d.id === dayId);
      if (!day) return;
      const savedState = JSON.parse(localStorage.getItem('workoutState_v2') || '{}');
      day.exercises.forEach(ex => {
        delete savedState[`${ex.id}_w${currentWeek}`];
      });
      localStorage.setItem('workoutState_v2', JSON.stringify(savedState));
      renderApp();
    }

    /* Časovač */
    let defaultTime = 90;
    let timeLeft = defaultTime;
    let timerInterval = null;

    function updateTimerDisplay() {
      const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const secs = (timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('time').innerText = `${mins}:${secs}`;
    }

    function setPreset(seconds) {
      defaultTime = seconds;
      resetTimer();
    }

    function toggleTimer() {
      const btn = document.getElementById('startBtn');
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        btn.innerText = 'Start';
      } else {
        btn.innerText = 'Pauza';
        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            timerInterval = null;
            btn.innerText = 'Start';
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            alert('Čas na další sérii!');
          }
        }, 1000);
      }
    }

    function resetTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      timeLeft = defaultTime;
      document.getElementById('startBtn').innerText = 'Start';
      updateTimerDisplay();
    }

    renderApp();
  </script>
</body>
</html>
